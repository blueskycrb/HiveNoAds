name: Build ad-block dylibs

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build all apps/*/ dylibs
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p dist
          shopt -s nullglob
          srcs=(apps/*/*.m)
          if [ ${#srcs[@]} -eq 0 ]; then
            echo "No sources under apps/*/*.m" >&2
            exit 1
          fi
          for src in "${srcs[@]}"; do
            app=$(basename "$(dirname "$src")")
            # dylib named by product (injection target): apps/Fengchao/Fengchao.m -> Fengchao.dylib
            out="dist/${app}.dylib"
            min_ios="13.0"
            if [ "$app" = "LoLMobile" ]; then
              min_ios="11.0"
            fi
            if [ "$app" = "Xiaohongshu" ]; then
              min_ios="14.0"
            fi
            if [ "$app" = "Douyin" ]; then
              min_ios="15.0"
            fi
            echo "==> building $out from $src"
            # Xiaohongshu / Douyin need Photos + AVFoundation for video re-export album save
            EXTRA_FW=""
            if [ "$app" = "Xiaohongshu" ] || [ "$app" = "Douyin" ]; then
              # fallback save: Photos write + AVFoundation re-export + CoreGraphics
              EXTRA_FW="-framework Photos -framework AVFoundation -framework CoreGraphics -framework CoreMedia"
            fi
            if [ "$app" = "AllowNotifications" ]; then
              EXTRA_FW="-framework UserNotifications"
              min_ios="14.0"
            fi
            if [ "$app" = "WeAppHelper" ]; then
              EXTRA_FW="-framework CoreGraphics"
              min_ios="14.0"
            fi
            EXTRA_SRC=""
            EXTRA_INC=""
            if [ "$app" = "WCallRecorder" ]; then
              # AVAudioPlayer playback + Shine MP3 encode helpers
              EXTRA_FW="-framework AVFoundation -framework AudioToolbox"
              EXTRA_INC="-Iapps/WCallRecorder/third_party/shine"
              if compgen -G "apps/WCallRecorder/third_party/shine/*.c" > /dev/null; then
                EXTRA_SRC=$(ls apps/WCallRecorder/third_party/shine/*.c)
              fi
              min_ios="14.0"
            fi
            # shellcheck disable=SC2086
            clang -dynamiclib \
              -isysroot "$SDK" \
              -arch arm64 \
              -miphoneos-version-min="$min_ios" \
              -fobjc-arc \
              -fblocks \
              -O2 \
              -fvisibility=hidden \
              -framework Foundation \
              -framework UIKit \
              $EXTRA_FW \
              $EXTRA_INC \
              -install_name "@rpath/${app}.dylib" \
              -o "$out" \
              "$src" \
              $EXTRA_SRC
            codesign -f -s - "$out" 2>/dev/null || true
            file "$out"
            ls -lh "$out"
          done
          ls -lh dist/

      - name: Package RootHide jailbreak debs
        run: |
          set -euo pipefail
          chmod +x apps/AllowNotifications/package_deb.sh
          bash apps/AllowNotifications/package_deb.sh
          chmod +x apps/WeAppHelper/package_deb.sh
          bash apps/WeAppHelper/package_deb.sh
          ls -lh dist/*.deb
          # Intermediate dylibs for these tweaks are packaged into .deb products.

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: noads-dylibs
          path: |
            dist/*.dylib
            dist/*.deb
          if-no-files-found: error

      - name: Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="build-${{ github.run_number }}"
          TITLE="NoAds dylibs #${{ github.run_number }}"
          # softprops/action-gh-release breaks on non-ASCII asset names.
          # Product-name dylibs (ASCII) for GitHub Releases compatibility.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists"
            gh release edit "$TAG" --title "$TITLE" --notes-file release-notes.md --draft=false
          else
            gh release create "$TAG" --title "$TITLE" --notes-file release-notes.md
          fi
          shopt -s nullglob
          files=(dist/*.dylib dist/*.deb)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No release assets in dist/" >&2
            exit 1
          fi
          ls -lh dist/
          for f in "${files[@]}"; do
            # Prefer shipping AllowNotifications as jailbreak .deb, not standalone dylib.
            base="$(basename "$f")"
            if [ "$base" = "AllowNotifications.dylib" ]; then
              echo "Skip uploading intermediate $base (packaged into .deb)"
              continue
            fi
            # WeAppHelper ships both RootHide .deb and TrollFools .dylib
            echo "Uploading $f"
            gh release upload "$TAG" "$f" --clobber
          done
          gh release view "$TAG"


